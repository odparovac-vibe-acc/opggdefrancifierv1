<!doctype html>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #1f2330; --muted: #6b7280; --line: #d9dce3; --accent: #5383e8; --warn: #d9480f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1e26; --fg: #e8eaf0; --muted: #9aa0ae; --line: #373a46; --accent: #6d98f0; --warn: #ff8a5b; }
  }
  body { margin: 0; width: 290px; padding: 14px; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  h1 { margin: 0; font-size: 15px; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
          background: transparent; color: inherit; font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  button { padding: 7px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  #toggle { margin-left: auto; padding: 5px 10px; background: transparent; color: var(--muted);
            border: 1px solid var(--line); font-size: 12px; }
  #toggle.paused { background: var(--warn); border-color: var(--warn); color: #fff; }
  body.paused .row { opacity: .5; }
  #msg { min-height: 1em; margin-top: 10px; font-size: 13px; color: var(--muted); }
</style>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>OP.GG Defrancifier</h1>
      <p>Fixes the language in op.gg links</p>
    </div>
    <button id="toggle">Pause</button>
  </header>
  <label for="lang">Language code</label>
  <div class="row">
    <input id="lang" placeholder="en" spellcheck="false" autocomplete="off">
    <button id="save">Save</button>
  </div>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
